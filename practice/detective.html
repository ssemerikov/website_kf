<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Детектив властивостей: аналізуй графік параболи та визначай її властивості.">
    <title>Детектив властивостей | Тренажер</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
    <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=dCb31709b45247a7861503a1d66881d2"></script>
    <style>
        .detective-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            margin-top: 30px;
            height: 600px;
        }
        .quest-panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #calculator { width: 100%; height: 100%; border-radius: 10px; }
        .question { padding: 15px; background: #f8f9fa; border-radius: 5px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .option-btn {
            padding: 10px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
        }
        .option-btn:hover { background: #e3f2fd; }
        .correct { background: #4caf50 !important; color: white; border-color: #4caf50; }
        .wrong { background: #f44336 !important; color: white; border-color: #f44336; }
        @media (max-width: 768px) {
            .detective-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            #calculator {
                height: 400px;
            }
            .quest-panel {
                padding: 15px;
            }
            .options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">
                <a href="../index.html">📐 Квадратична<span>Функція</span></a>
            </div>
            <ul class="nav-links">
                <li><a href="../theory/index.html">📖 Теорія</a></li>
                <li><a href="index.html" class="active">🏋️ Тренажери</a></li>
                <li><a href="../tests/index.html">📝 Тести</a></li>
                <li><a href="../index.html#progress">📊 Прогрес</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 style="margin-top: 20px;">Детектив властивостей</h1>
        <p>Проаналізуй графік та дай правильні відповіді.</p>

        <div class="detective-container">
            <div id="calculator"></div>
            <div class="quest-panel">
                <div id="quest-box" class="question">
                    <h3 id="question-text">Завантаження завдання...</h3>
                    <div id="options-box" class="options"></div>
                </div>
                <div id="score" style="font-weight: 700;">Рахунок: 0</div>
                <button class="btn btn-secondary" onclick="nextQuestion()">Пропустити</button>
                <a href="index.html" class="btn btn-secondary" style="text-align: center;">Назад</a>
            </div>
        </div>
    </main>

    <script>
        const elt = document.getElementById('calculator');
        const calculator = Desmos.GraphingCalculator(elt, {
            expressions: false,
            settingsMenu: false,
            zoomButtons: true,
            lockViewport: true
        });

        let score = 0;
        let currentAns = "";
        let transitioning = false;

        function formatQuadraticDetective(a, b, c) {
            let latex = 'y=';
            if (a === 1) latex += 'x^2';
            else if (a === -1) latex += '-x^2';
            else latex += `${a}x^2`;
            if (b !== 0) {
                if (b > 0) latex += '+';
                if (b === 1) latex += 'x';
                else if (b === -1) latex += '-x';
                else latex += `${b}x`;
            }
            if (c !== 0) {
                if (c > 0) latex += '+';
                latex += `${c}`;
            }
            return latex;
        }

        const questions = [
            {
                type: 'direction',
                text: 'Куди спрямовані гілки цієї параболи?',
                func: () => {
                    const a = Math.random() > 0.5 ? 1 : -1;
                    const scale = Math.floor(Math.random() * 3) + 1;
                    const c = Math.floor(Math.random() * 5) - 2;
                    return { latex: formatQuadraticDetective(a * scale, 0, c), ans: a > 0 ? 'Вгору' : 'Вниз', options: ['Вгору', 'Вниз'] };
                }
            },
            {
                type: 'roots',
                text: 'Скільки нулів має ця функція?',
                func: () => {
                    const type = Math.floor(Math.random() * 3);
                    let a, b, c;
                    if (type === 0) {
                        a = 1; b = 0; c = Math.floor(Math.random() * 4) + 1;
                    } else if (type === 1) {
                        const root = Math.floor(Math.random() * 7) - 3;
                        a = 1; b = -2 * root; c = root * root;
                    } else {
                        const r1 = Math.floor(Math.random() * 7) - 3;
                        const r2 = Math.floor(Math.random() * 7) - 3;
                        a = 1; b = -(r1 + r2); c = r1 * r2;
                    }
                    const latex = formatQuadraticDetective(a, b, c);
                    const ans = type === 0 ? '0' : type === 1 ? '1' : '2';
                    return { latex, ans, options: ['0', '1', '2', 'Безліч'] };
                }
            },
            {
                type: 'vertex',
                text: 'Яка абсциса (x₀) вершини?',
                func: () => {
                    const x0 = Math.floor(Math.random() * 7) - 3;
                    let latex;
                    if (x0 === 0) latex = 'y=x^2';
                    else if (x0 > 0) latex = `y=(x-${x0})^2`;
                    else latex = `y=(x+${Math.abs(x0)})^2`;
                    const optSet = new Set([x0.toString()]);
                    let offset = 1;
                    while (optSet.size < 4) {
                        optSet.add((x0 + offset).toString());
                        optSet.add((x0 - offset).toString());
                        offset++;
                    }
                    const options = [...optSet].slice(0, 4);
                    return { latex, ans: x0.toString(), options };
                }
            }
        ];

        function nextQuestion() {
            transitioning = false;
            const q = questions[Math.floor(Math.random() * questions.length)];
            const data = q.func();

            document.getElementById('question-text').textContent = q.text;
            calculator.setExpression({ id: 'g', latex: data.latex, color: Desmos.Colors.BLUE });

            const optionsBox = document.getElementById('options-box');
            while (optionsBox.firstChild) optionsBox.removeChild(optionsBox.firstChild);
            currentAns = data.ans;

            data.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAns(btn, opt);
                optionsBox.appendChild(btn);
            });
        }

        function checkAns(btn, val) {
            if (transitioning) return;
            if (val == currentAns) {
                btn.classList.add('correct');
                score++;
                transitioning = true;
                document.getElementById('score').textContent = `Рахунок: ${score}`;
                document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none');
                setTimeout(() => {
                    transitioning = false;
                    nextQuestion();
                }, 1000);
            } else {
                btn.classList.add('wrong');
                btn.style.pointerEvents = 'none';
            }
        }

        nextQuestion();
    </script>
    <footer>
        <div class="container">
            <p>&copy; 2026 Інтерактивний освітній ресурс. Квадратична функція.</p>
        </div>
    </footer>
</body>
</html>
